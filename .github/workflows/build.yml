name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Build the single-file bundle
        run: node build.js
      - name: Verify the bundle is self-contained and parses
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            if (html.length < 400000) throw new Error('bundle looks truncated: ' + html.length);
            if (/<script[^>]+src=/.test(html)) throw new Error('bundle has an external script tag');
            for (const f of ['p1_core','p2_models','p3_world','p4_game','p5_hud_loop'])
              new Function(fs.readFileSync('src/' + f + '.js', 'utf8'));
            console.log('ok — ' + (html.length/1024).toFixed(0) + ' KB, no external refs');
          "
