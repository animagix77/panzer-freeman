<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panzer Freeman · Motion preview</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#100c19; color:#eee0c5; font:13px system-ui,sans-serif; }
  iframe { display:block; border:0; width:100%; height:calc(100vh - 64px); }
  footer { height:64px; display:flex; align-items:center; gap:18px; padding:12px 20px; }
  strong { color:#ffd25e; } a { color:#8fd9ff; margin-left:auto; }
  button, select { background:#251c32; color:#eee0c5; border:1px solid #5b496c; padding:8px; }
</style>
<iframe id="game" src="../index.html" title="Flight animation preview"></iframe>
<footer>
  <strong id="motion">Loading…</strong>
  <select id="view" aria-label="Camera view"><option value="0">Rear view</option><option value="1">Side view</option><option value="2">Front view</option></select>
  <button id="pause">Pause</button><button id="slow">Half speed</button>
  <a href="../index.html">Play the game</a>
</footer>
<script>
// A development-only playback of the actual flight controller and rig. The
// normal game frame still renders the scene, but combat stays disabled.
const frame = document.getElementById('game');
const label = document.getElementById('motion');
let P, last = 0, elapsed = 0, paused = false, slow = false, started = false;
const moves = [
  [1, '', 'Level flight'], [.65, 'd', 'Bank right'], [1, '', 'Release & settle'],
  [1.1, 'a', 'Reverse left'], [1, '', 'Release & settle'],
  [.65, 's', 'Climb'], [1, '', 'Glide'], [1.1, 'w', 'Dive'], [1, '', 'Recover'],
  [2.8, 'd', 'Hold at corridor edge'], [1.3, '', 'Level again']
];
document.getElementById('pause').onclick = e => { paused = !paused; e.target.textContent = paused ? 'Resume' : 'Pause'; };
document.getElementById('slow').onclick = e => { slow = !slow; e.target.textContent = slow ? 'Normal speed' : 'Half speed'; };
document.getElementById('view').onchange = e => {
  if (P) { P.Player.viewIndex = +e.target.value; P.Player.camYawTarget = +e.target.value * Math.PI / 2; }
};
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(.04, (now - last) / 1000 || 0); last = now;
  const win = frame.contentWindow;
  if (!started) {
    if (!win.__PF || !win.__PF.entities || !win.document.getElementById('loading').classList.contains('gone')) return;
    P = win.__PF; P.Game.state = 'motion-preview'; P.Game.cinematic = false;
    P.el.title.classList.remove('on'); P.el.skip.classList.remove('on');
    P.Input.ndx = P.Input.ndy = 0;
    started = true;
  }
  if (paused) return;
  const delta = dt * (slow ? .5 : 1);
  elapsed += delta;
  const duration = moves.reduce((s, m) => s + m[0], 0);
  let cursor = elapsed % duration, move = moves[0];
  for (const candidate of moves) {
    move = candidate; if (cursor < move[0]) break; cursor -= move[0];
  }
  label.textContent = move[2];
  P.Input.keys = move[1] ? { [move[1]]: true } : {};
  P.Game.time += delta;
  P.entities.updatePlayer(delta);
  P.terrain.update(P.Game.railZ);
}
requestAnimationFrame(tick);
</script>
</html>
